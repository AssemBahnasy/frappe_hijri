<!-- Frappe Hijri's dual-tone module icons for the desk dock and sidebar headers. Each symbol
     animates while its dock tile is hovered, through the icon-motion custom properties the tile
     sets (frappe/public/scss/desk/dock.scss): `--icon-motion` (paused | running) and
     `--icon-motion-opacity` (0 | 1).

     A name must end in `-duotone` for the dock to draw it on the 24px grid with the tile's tones.
     Every id, class and custom property is prefixed `hijri-` so nothing clashes with another
     app's sprite.

     This sprite is inserted into the page, so the style block below is a document stylesheet. -->

<svg id="hijri-module-symbols" aria-hidden="true" style="display: none;" class="icon" xmlns="http://www.w3.org/2000/svg">
	<style>
		/* Green, from the Frappe Hijri logo (#07492a). The light tone is the body of a shape, the
		   dark tone its detail. light-dark() picks per theme: the dark theme swaps to a deeper body
		   and a brighter detail so the pair still reads on a dark tray.
		     rest     light: #bfe0cc / #0d6b3f     dark: #1f4d36 / #5fbf8a
		     active   light: #9fceb2 / #07492a     dark: #2a6447 / #86d6a8 */
		:root {
			--hijri-green-light: light-dark(#bfe0cc, #1f4d36);
			--hijri-green-dark: light-dark(#0d6b3f, #5fbf8a);
			--hijri-green-light-active: light-dark(#9fceb2, #2a6447);
			--hijri-green-dark-active: light-dark(#07492a, #86d6a8);
		}
		/* Frappe's sprite sets grey tones on every duotone tile and header. These win for Hijri's
		   icons only, through the symbol the tile holds, so other apps keep their own. */
		.dock-item--duotone:has(use[href^="#icon-hijri-"]),
		.shell-header:hover .header-logo:has(use[href^="#icon-hijri-"]),
		.shell-header.hover .header-logo:has(use[href^="#icon-hijri-"]) {
			--duotone-light: var(--hijri-green-light);
			--duotone-dark: var(--hijri-green-dark);
		}
		.dock-item--duotone.active:has(use[href^="#icon-hijri-"]) {
			--duotone-light: var(--hijri-green-light-active);
			--duotone-dark: var(--hijri-green-dark-active);
		}

		/* Calendar: the moon moves through its phases, and a star twinkles beside it. The phase is
		   the page-coloured disc sliding across the dark one. */
		.hijri-moon-shadow {
			animation: hijri-phase 2.4s ease-in-out infinite;
			animation-play-state: var(--icon-motion, paused);
		}
		@keyframes hijri-phase {
			0%, 100% { transform: translate(0, 0); }
			50% { transform: translate(2.4px, -0.8px); }
		}
		.hijri-star {
			transform-box: fill-box;
			transform-origin: center;
			animation: hijri-twinkle 1.2s ease-in-out infinite;
			animation-play-state: var(--icon-motion, paused);
		}
		@keyframes hijri-twinkle {
			0%, 100% { transform: scale(1); opacity: 1; }
			50% { transform: scale(0.4); opacity: 0.5; }
		}

		/* Settings: the gear turns around its crescent. */
		.hijri-gear {
			transform-box: view-box;
			transform-origin: 12px 12px;
			animation: hijri-gear 4s linear infinite;
			animation-play-state: var(--icon-motion, paused);
		}
		@keyframes hijri-gear {
			to { transform: rotate(360deg); }
		}
	</style>

	<!-- Calendar: a month page with the crescent moon of the lunar calendar. -->
	<symbol viewBox="0 0 24 24" id="icon-hijri-calendar-duotone" stroke="none" style="overflow: visible">
		<rect x="3" y="4.5" width="18" height="17" rx="2.5" style="fill: var(--duotone-light, var(--hijri-green-light))" />
		<path d="M5.5 4.5h13A2.5 2.5 0 0 1 21 7v2.5H3V7a2.5 2.5 0 0 1 2.5-2.5z" style="fill: var(--duotone-dark, var(--hijri-green-dark))" />
		<rect x="7" y="2" width="2" height="4.6" rx="1" style="fill: var(--duotone-dark, var(--hijri-green-dark))" />
		<rect x="15" y="2" width="2" height="4.6" rx="1" style="fill: var(--duotone-dark, var(--hijri-green-dark))" />
		<clipPath id="hijri-page-clip"><rect x="3" y="9.5" width="18" height="12" /></clipPath>
		<g clip-path="url(#hijri-page-clip)">
			<circle cx="11" cy="15.6" r="4.2" style="fill: var(--duotone-dark, var(--hijri-green-dark))" />
			<circle class="hijri-moon-shadow" cx="12.9" cy="14.5" r="3.6" style="fill: var(--duotone-light, var(--hijri-green-light))" />
		</g>
		<path class="hijri-star" d="M17.2 14.4l.55 1.25 1.25.55-1.25.55-.55 1.25-.55-1.25-1.25-.55 1.25-.55z" style="fill: var(--duotone-dark, var(--hijri-green-dark))" />
	</symbol>

	<!-- Settings: a gear with a crescent at its hub. -->
	<symbol viewBox="0 0 24 24" id="icon-hijri-settings-duotone" stroke="none" style="overflow: visible">
		<g class="hijri-gear">
			<g style="fill: var(--duotone-light, var(--hijri-green-light))">
				<circle cx="12" cy="12" r="6.6" />
				<rect x="10.4" y="2.2" width="3.2" height="3.6" rx="0.6" />
				<rect x="10.4" y="2.2" width="3.2" height="3.6" rx="0.6" transform="rotate(45 12 12)" />
				<rect x="10.4" y="2.2" width="3.2" height="3.6" rx="0.6" transform="rotate(90 12 12)" />
				<rect x="10.4" y="2.2" width="3.2" height="3.6" rx="0.6" transform="rotate(135 12 12)" />
				<rect x="10.4" y="2.2" width="3.2" height="3.6" rx="0.6" transform="rotate(180 12 12)" />
				<rect x="10.4" y="2.2" width="3.2" height="3.6" rx="0.6" transform="rotate(225 12 12)" />
				<rect x="10.4" y="2.2" width="3.2" height="3.6" rx="0.6" transform="rotate(270 12 12)" />
				<rect x="10.4" y="2.2" width="3.2" height="3.6" rx="0.6" transform="rotate(315 12 12)" />
			</g>
		</g>
		<circle cx="12" cy="12" r="3.3" style="fill: var(--duotone-dark, var(--hijri-green-dark))" />
		<circle cx="13.4" cy="11.1" r="2.7" style="fill: var(--duotone-light, var(--hijri-green-light))" />
	</symbol>
</svg>
